<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Найди пару 🎵</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root { --accent: #FFCC00; }

  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background: #0a0a0f;
    color: #fff;
    touch-action: manipulation;
  }

  #app {
    height: 100dvh; width: 100vw;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  #bg {
    position: absolute; inset: 0;
    background-image: url('https://www.dropbox.com/scl/fi/d2lkhhxas7lsnuquqeho1/3000.jpg?rlkey=1onrc0rf0y4k2nqneeqje5tx1&st=9pyh8pjk&dl=1');
    background-size: cover; background-position: center; z-index: 0;
  }
  #bg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(8,6,18,0.75); backdrop-filter: blur(3px);
  }

  #header {
    position: relative; z-index: 10;
    padding: 10px 14px 6px;
    padding-top: max(10px, env(safe-area-inset-top, 10px));
    flex-shrink: 0;
  }

  #title-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }

  #game-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 14px; font-weight: 900;
    color: var(--accent); text-transform: uppercase;
  }

  #stats { display: flex; gap: 6px; }
  .stat {
    background: rgba(255,255,255,0.1);
    border: 0.5px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 3px 10px;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7);
  }
  .stat span { color: #fff; }

  #mode-row { display: flex; gap: 8px; }
  .mode-btn {
    flex: 1;
    border: 0.5px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    border-radius: 20px; padding: 5px 0;
    font-size: 12px; font-family: 'Unbounded', sans-serif; font-weight: 700;
    cursor: pointer; color: rgba(255,255,255,0.6);
    -webkit-tap-highlight-color: transparent; transition: all 0.15s;
  }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }

  #grid-wrap {
    position: relative; z-index: 10;
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 6px 10px;
  }

  #grid { display: grid; }

  .card {
    position: relative;
    border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card-inner {
    position: absolute; inset: 0; border-radius: 10px;
    transform-style: preserve-3d;
    transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
  }
  .card-front, .card-back {
    position: absolute; inset: 0; border-radius: 10px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .card-back {
    background: rgba(255,255,255,0.11);
    border: 0.5px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.2);
  }
  .card-front {
    background: rgba(255,255,255,0.18);
    border: 0.5px solid rgba(255,255,255,0.35);
    transform: rotateY(180deg);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched { animation: matchPop 0.32s ease forwards; }
  @keyframes matchPop {
    0%   { transform: scale(1);    opacity: 1; }
    40%  { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(0);    opacity: 0; }
  }
  .card.shake .card-inner { animation: shake 0.35s ease; }
  @keyframes shake {
    0%,100% { transform: rotateY(180deg) translateX(0); }
    25%     { transform: rotateY(180deg) translateX(-5px); }
    75%     { transform: rotateY(180deg) translateX(5px); }
  }

  /* WIN */
  #win-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    flex-direction: column; background: #000;
  }
  #win-overlay.show { display: flex; }
  #video-wrap { flex: 1; overflow: hidden; background: #000; }
  #win-video { width: 100%; height: 100%; object-fit: cover; display: block; }

  #close-btn {
    position: absolute;
    top: max(14px, env(safe-area-inset-top, 14px)); right: 14px;
    z-index: 201;
    background: rgba(0,0,0,0.5);
    border: 0.5px solid rgba(255,255,255,0.3); color: #fff;
    width: 38px; height: 38px; border-radius: 50%;
    font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; backdrop-filter: blur(6px);
  }

  #prize-bar {
    background: #0e0e14;
    border-top: 0.5px solid rgba(255,255,255,0.12);
    padding: 12px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  #prize-cover {
    width: 56px; height: 56px; border-radius: 10px;
    object-fit: cover; flex-shrink: 0;
    border: 0.5px solid rgba(255,255,255,0.15);
  }
  #prize-info { flex: 1; min-width: 0; }
  #prize-title {
    color: #fff; font-family: 'Unbounded', sans-serif;
    font-size: 13px; font-weight: 700;
  }
  #prize-sub { color: rgba(255,255,255,0.45); font-size: 11px; margin: 3px 0 8px; }
  #prize-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .music-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif;
    text-decoration: none; border: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ym-btn { background: #FFCC00; color: #000; }
  .vk-btn { background: #0077FF; color: #fff; }

  .confetti {
    position: absolute; width: 8px; height: 8px;
    border-radius: 2px; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg);    opacity: 1; }
    100% { transform: translateY(100dvh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="header">
    <div id="title-row">
      <div id="game-title">Найди пару</div>
      <div id="stats">
        <div class="stat">🔁 <span id="moves">0</span></div>
        <div class="stat">✅ <span id="found">0</span>/<span id="total">8</span></div>
      </div>
    </div>
    <div id="mode-row">
      <button class="mode-btn active" data-mode="16">16</button>
      <button class="mode-btn" data-mode="32">32</button>
      <button class="mode-btn" data-mode="64">64</button>
    </div>
  </div>
  <div id="grid-wrap">
    <div id="grid"></div>
  </div>
</div>

<div id="win-overlay">
  <button id="close-btn">✕</button>
  <div id="video-wrap">
    <video id="win-video" autoplay playsinline loop muted>
      <source src="https://www.dropbox.com/scl/fi/jdpwyqto6uyv90bnh6q2u/1004-SAYAN-get.gt.mp4?rlkey=qbr4h4cj64jqkeowffojeo7za&st=l5t6cyo5&dl=1" type="video/mp4">
    </video>
  </div>
  <div id="prize-bar">
    <img id="prize-cover" src="https://www.dropbox.com/scl/fi/d2lkhhxas7lsnuquqeho1/3000.jpg?rlkey=1onrc0rf0y4k2nqneeqje5tx1&st=9pyh8pjk&dl=1" alt="обложка">
    <div id="prize-info">
      <div id="prize-title">SAYAN — Get</div>
      <div id="prize-sub">Слушать трек:</div>
      <div id="prize-links">
        <a class="music-btn ym-btn" href="https://music.yandex.ru/album/41489388/track/150053393?utm_source=web&utm_medium=copy_link" target="_blank">♪ Яндекс Музыка</a>
        <a class="music-btn vk-btn" href="https://vk.com/audio-2001621469_148621469" target="_blank">▶ ВК Музыка</a>
      </div>
    </div>
  </div>
</div>

<script>
const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦅','🦋','🐛','🐌','🐞','🐜','🦟','🦗','🐝','🐢','🦎','🦕','🦖'];

let cards = [], flipped = [], matched = 0, moves = 0, lock = false, mode = 16;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Key fix: measure available space AFTER layout, compute card px size
function calcSize(cols, rows, gap) {
  const wrap = document.getElementById('grid-wrap');
  const W = wrap.clientWidth  - 20;
  const H = wrap.clientHeight - 12;
  const byW = (W - gap * (cols - 1)) / cols;
  const byH = (H - gap * (rows - 1)) / rows;
  return Math.floor(Math.min(byW, byH));
}

function initGame(n) {
  mode = n;
  flipped = []; matched = 0; moves = 0; lock = false;
  const pairs = n / 2;
  cards = shuffle([...EMOJIS.slice(0, pairs), ...EMOJIS.slice(0, pairs)]);
  document.getElementById('moves').textContent = '0';
  document.getElementById('found').textContent = '0';
  document.getElementById('total').textContent = pairs;
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', parseInt(b.dataset.mode) === n)
  );
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const gap = 6;
  const cols = mode === 16 ? 4 : mode === 32 ? 6 : 8;
  const rows = mode / cols;

  const size = calcSize(cols, rows, gap);
  const emoji = Math.max(10, Math.floor(size * 0.45));

  grid.style.cssText = `
    display: grid;
    grid-template-columns: repeat(${cols}, ${size}px);
    grid-template-rows: repeat(${rows}, ${size}px);
    gap: ${gap}px;
  `;
  grid.innerHTML = '';

  cards.forEach((em, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = i;
    card.style.width  = size + 'px';
    card.style.height = size + 'px';
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-back" style="font-size:${Math.floor(emoji*0.55)}px">?</div>
        <div class="card-front" style="font-size:${emoji}px">${em}</div>
      </div>`;
    card.addEventListener('click', () => flip(i, card));
    grid.appendChild(card);
  });
}

function cardEl(i) { return document.querySelector(`.card[data-idx="${i}"]`); }

function flip(i, el) {
  if (lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  el.classList.add('flipped');
  flipped.push(i);

  if (flipped.length === 2) {
    lock = true;
    moves++;
    document.getElementById('moves').textContent = moves;
    const [a, b] = flipped;

    if (cards[a] === cards[b]) {
      matched++;
      document.getElementById('found').textContent = matched;
      setTimeout(() => {
        [cardEl(a), cardEl(b)].forEach(c => {
          c.classList.add('matched');
          setTimeout(() => { c.style.visibility = 'hidden'; }, 320);
        });
      }, 150);
      flipped = []; lock = false;
      if (matched === mode / 2) setTimeout(showWin, 700);
    } else {
      setTimeout(() => {
        [cardEl(a), cardEl(b)].forEach(c => {
          c.classList.remove('flipped');
          c.classList.add('shake');
          setTimeout(() => c.classList.remove('shake'), 350);
        });
        flipped = []; lock = false;
      }, 900);
    }
  }
}

function spawnConfetti() {
  const colors = ['#FFCC00','#FF6B6B','#6BFFB8','#6BB5FF','#FF6BFF','#FFAA6B'];
  const ov = document.getElementById('win-overlay');
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.cssText = `left:${Math.random()*100}%;top:0;background:${colors[i%colors.length]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.8}s`;
    ov.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}

function showWin() {
  const ov = document.getElementById('win-overlay');
  ov.classList.add('show');
  const vid = document.getElementById('win-video');
  vid.muted = false;
  vid.load();
  vid.play().catch(() => { vid.muted = true; vid.play(); });
  spawnConfetti();
}

document.getElementById('close-btn').addEventListener('click', () => {
  document.getElementById('win-overlay').classList.remove('show');
  const vid = document.getElementById('win-video');
  vid.pause(); vid.currentTime = 0;
  initGame(mode);
});

document.querySelectorAll('.mode-btn').forEach(btn =>
  btn.addEventListener('click', () => initGame(parseInt(btn.dataset.mode)))
);

window.addEventListener('resize', () => renderGrid());

initGame(16);
</script>
</body>
</html>
